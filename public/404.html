<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta
      name="description"
      content="The page you’re looking for doesn’t exist. Return to K-Aesthetic Skin for skincare treatments and booking."
    />
    <title>Page not found | K-Aesthetic Skin</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #faf7f5;
        color: #1c1917;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        width: min(36rem, 100%);
        padding: 2rem;
        border-radius: 1rem;
        background: #fff;
        border: 1px solid #e7e5e4;
      }
      .eyebrow { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #78716c; }
      h1 { margin: 0.75rem 0 0; font-size: clamp(1.75rem, 4vw, 2.1rem); }
      p { margin: 1rem 0 0; color: #57534e; line-height: 1.6; }
      .actions { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }
      a {
        display: inline-flex; align-items: center; justify-content: center;
        padding: 0.7rem 1.1rem; border-radius: 0.55rem; font-weight: 600; text-decoration: none;
      }
      .primary { background: #1c1917; color: #fff; }
      .secondary { background: #f5f5f4; color: #1c1917; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">404</div>
      <h1>Page not found</h1>
      <p>That URL doesn’t exist on K-Aesthetic Skin. Head home to explore services or book an appointment.</p>
      <div class="actions">
        <a class="primary" href="/">Back to home</a>
        <a class="secondary" href="/booking">Book now</a>
      </div>
    </main>
  </body>
</html>
